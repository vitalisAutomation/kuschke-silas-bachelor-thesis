<div class="dashboard">
    <!-- Metrik Kreise -->
    <div class="metrics-row">
        <!-- CPU Kreis -->
        <div class="metric-card">
            <h3>CPU</h3>
            <div class="progress-circle">
                <svg>
                    <circle cx="70" cy="70" r="50"></circle>
                    <circle cx="70" cy="70" r="50" style="stroke-dashoffset: calc(314 - (314 * 60) / 100);"></circle>
                </svg>
                <div class="value">{{ cpuUsage }}%</div>
            </div>
        </div>

        <!-- RAM Kreis -->
        <div class="metric-card">
            <h3>RAM</h3>
            <div class="progress-circle">
                <svg>
                    <circle cx="70" cy="70" r="50"></circle>
                    <circle cx="70" cy="70" r="50" style="stroke-dashoffset: calc(314 - (314 * 40) / 100);"></circle>
                </svg>
                <div class="value">{{ ramUsage }}%</div>
            </div>
        </div>

        <!-- Storage Kreis -->
        <div class="metric-card">
            <h3>Storage</h3>
            <div class="progress-circle">
                <svg>
                    <circle cx="70" cy="70" r="50"></circle>
                    <circle cx="70" cy="70" r="50" style="stroke-dashoffset: calc(314 - (314 * 20) / 100);"></circle>
                </svg>
                <div class="value">{{ storageUsage }}%</div>
            </div>
        </div>
    </div>

    <!-- Sektion für den Scheduler (Modus-Wechsel) -->
    <div class="scheduler-card">
        <h3>ctrlX Scheduler Control</h3>
        
        <div class="status-indicator">
            <span>Aktueller Zustand:</span>
            <!-- Dynamische Klassen-Färbung je nach State -->
            <span class="state-badge" [ngClass]="{
                'state-operating': currentState === 'OPERATING',
                'state-setup': currentState === 'SETUP',
                'state-service': currentState === 'SERVICE'
            }">
                {{ currentState }}
            </span>
        </div>

        <!-- Fehlermeldung falls beim Umschalten etwas schief geht (z.B. Achsen noch aktiv) -->
        <div *ngIf="errorMessage" class="error-banner">
            ⚠️ {{ errorMessage }}
        </div>

        <!-- Interaktive Buttons -->
        <div class="control-buttons">
            <button 
                class="btn btn-operating" 
                (click)="onStateChange('OPERATING')" 
                [disabled]="loading || currentState === 'OPERATING'">
                🟢 OPERATING
            </button>
            <button 
                class="btn btn-setup" 
                (click)="onStateChange('SETUP')" 
                [disabled]="loading || currentState === 'SETUP'">
                🟡 SETUP
            </button>
            <button 
                class="btn btn-service" 
                (click)="onStateChange('SERVICE')" 
                [disabled]="loading || currentState === 'SERVICE'">
                🔵 SERVICE
            </button>
        </div>
    </div>
</div>
