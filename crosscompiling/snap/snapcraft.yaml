name: sdk-py-console
title: SDK Python Console Program
version: 1.0.0
summary: Minimal NumPy console program for ctrlX
description: |
  This sample runs a minimal NumPy calculation and prints the result.

base: core24
confinement: strict
grade: stable

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT

# The aarch64 wheels are built beforehand by build-snap-arm64.sh in an emulated
# container, so packing itself runs natively on the amd64 host.
platforms:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  app:
    command: bin/run.sh
    plugs:
      - network
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 5s

parts:
  app:
    plugin: dump
    source: .
    # The ctrlX package manager only reads manifests from $SNAP/package-assets.
    organize:
      configs/package-assets/*.package-manifest.json: package-assets/
    override-pull: |
      craftctl default
      rm -rf \
        "$CRAFT_PART_SRC/venv" \
        "$CRAFT_PART_SRC/.venv" \
        "$CRAFT_PART_SRC/qemu" \
        "$CRAFT_PART_SRC/.git" \
        "$CRAFT_PART_SRC/.vscode" \
        "$CRAFT_PART_SRC/parts" \
        "$CRAFT_PART_SRC/prime" \
        "$CRAFT_PART_SRC/stage" \
        "$CRAFT_PART_SRC/overlay" \
        "$CRAFT_PART_SRC/.craft"
      rm -f "$CRAFT_PART_SRC"/*.snap
    build-packages:
      - python3-pip
    stage-packages:
      - libopenblas0-pthread
      - libgfortran5
      - liblapack3
      - libsystemd0
    prime:
      - -wheelhouse
    override-build: |
      craftctl default

      if [ ! -d wheelhouse ]; then
        echo "wheelhouse/ is missing - run build-snap-arm64.sh instead of snapcraft directly." >&2
        exit 1
      fi

      # Install the prebuilt aarch64 wheels without resolving anything online.
      # Several --platform tags are needed because manylinux wheels do not
      # match the plain linux_aarch64 tag.
      pip3 install \
        --no-index \
        --find-links wheelhouse \
        --only-binary :all: \
        --platform linux_aarch64 \
        --platform manylinux2014_aarch64 \
        --platform manylinux_2_17_aarch64 \
        --platform manylinux_2_28_aarch64 \
        --python-version 3.12 \
        --implementation cp \
        --abi cp312 \
        --target "$CRAFT_PART_INSTALL/lib/python3.12/site-packages" \
        -r requirements.txt

  wrapper-scripts:
    plugin: dump
    source: wrapper/
    organize:
      ./run.sh : bin/run.sh

lint:
  ignore:
    - library
