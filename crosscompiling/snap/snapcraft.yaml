name: sdk-py-console
title: SDK Python Console Program
version: 1.0.0
summary: Minimal NumPy console program for ctrlX
description: |
  This sample runs a minimal NumPy calculation and prints the result.

base: core24
confinement: strict
grade: stable

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT

# Wheel mode: build-snap.sh mode 1 downloads ARM64 wheels on an AMD64 host.
# The wheelhouse is intentionally not committed to the repository.
# Native mode: build-snap.sh modes 2 and 3 install dependencies for the native
# build architecture inside Snapcraft's build environment.
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  app:
    command: bin/run.sh
    plugs:
      - network
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 5s

parts:
  app:
    plugin: dump
    source: .
    # The ctrlX package manager only reads manifests from $SNAP/package-assets.
    organize:
      configs/package-assets/*.package-manifest.json: package-assets/
    override-pull: |
      craftctl default
      rm -rf \
        "$CRAFT_PART_SRC/venv" \
        "$CRAFT_PART_SRC/.venv" \
        "$CRAFT_PART_SRC/qemu" \
        "$CRAFT_PART_SRC/.git" \
        "$CRAFT_PART_SRC/.vscode" \
        "$CRAFT_PART_SRC/parts" \
        "$CRAFT_PART_SRC/prime" \
        "$CRAFT_PART_SRC/stage" \
        "$CRAFT_PART_SRC/overlay" \
        "$CRAFT_PART_SRC/.craft"
      rm -f "$CRAFT_PART_SRC"/*.snap
    build-packages:
      - python3-pip
    stage-packages:
      # NumPy links against OpenBLAS/LAPACK at runtime.
      # Add libsystemd0 here again as soon as cysystemd is back in requirements.txt.
      - libopenblas0-pthread
      - libgfortran5
      - liblapack3
    prime:
      - -wheelhouse
    override-build: |
      craftctl default

      BUILD_MODE="${SNAP_BUILD_MODE:-$(cat "$CRAFT_PART_SRC/.snap-build-mode" 2>/dev/null || echo native)}"
      rm -f "$CRAFT_PART_SRC/.snap-build-mode"

      if [ "$BUILD_MODE" = "wheels" ]; then
        if [ ! -d wheelhouse ]; then
          echo "Wheel mode was selected, but wheelhouse/ is missing. Run build-snap.sh and choose mode 1." >&2
          exit 1
        fi

        # Install only prebuilt ARM64 wheels; no source build or network lookup.
        # --break-system-packages is needed on Ubuntu 24.04 build environments.
        pip3 install \
          --break-system-packages \
          --no-index \
          --find-links wheelhouse \
          --only-binary :all: \
          --platform linux_aarch64 \
          --platform manylinux2014_aarch64 \
          --platform manylinux_2_17_aarch64 \
          --platform manylinux_2_28_aarch64 \
          --python-version 3.12 \
          --implementation cp \
          --abi cp312 \
          --target "$CRAFT_PART_INSTALL/lib/python3.12/site-packages" \
          -r requirements.txt
      else
        # Native mode resolves dependencies for the local build architecture.
        pip3 install \
          --break-system-packages \
          --target "$CRAFT_PART_INSTALL/lib/python3.12/site-packages" \
          -r requirements.txt
      fi

  wrapper-scripts:
    plugin: dump
    source: wrapper/
    organize:
      ./run.sh : bin/run.sh
    override-build: |
      craftctl default
      # Git on Windows does not preserve the executable bit.
      chmod +x "$CRAFT_PART_INSTALL/run.sh"

lint:
  ignore:
    - library
