name: sdk-py-console
title: SDK Python Console Program
version: 1.0.0
summary: Minimal NumPy console program for ctrlX
description: |
  This sample runs a minimal NumPy calculation and prints the result.

base: core24
confinement: strict
grade: stable

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT

# Built natively on arm64 - emulated via qemu-user-static/binfmt on x86 hosts.
platforms:
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  app:
    command: bin/run.sh
    plugs:
      - network
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 5s

parts:
  app:
    plugin: dump
    source: .
    # The ctrlX package manager only reads manifests from $SNAP/package-assets.
    organize:
      configs/package-assets/: package-assets/
    override-pull: |
      craftctl default
      rm -rf \
        "$CRAFT_PART_SRC/venv" \
        "$CRAFT_PART_SRC/.venv" \
        "$CRAFT_PART_SRC/parts" \
        "$CRAFT_PART_SRC/prime" \
        "$CRAFT_PART_SRC/stage" \
        "$CRAFT_PART_SRC/overlay" \
        "$CRAFT_PART_SRC/.craft"
    build-packages:
      - build-essential
      - ccache
      - gfortran
      - pkg-config
      - python3-dev
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - cython3
      - meson
      - ninja-build
      - patchelf
      - libopenblas-dev
      - liblapack-dev
      - libsystemd-dev
    stage-packages:
      - libopenblas0-pthread
      - libgfortran5
      - liblapack3
      - libsystemd0
    override-build: |
      craftctl default

      # ccache and the pip cache live outside the part dir, so they survive
      # 'snapcraft clean' and make emulated rebuilds far cheaper.
      export PATH="/usr/lib/ccache:$PATH"
      export CCACHE_DIR="${CCACHE_DIR:-/root/.ccache}"
      export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-5G}"
      export MAKEFLAGS="-j$(nproc)"

      # Forces source builds. Restrict via SNAP_PIP_NO_BINARY if a package is
      # published as a wheel only (without an sdist).
      pip3 install \
        --cache-dir "${PIP_CACHE_DIR:-/root/.cache/pip}" \
        --no-binary "${SNAP_PIP_NO_BINARY:-:all:}" \
        --target "$CRAFT_PART_INSTALL/lib/python3.12/site-packages" \
        -r requirements.txt

      ccache --show-stats || true

  wrapper-scripts:
    plugin: dump
    source: wrapper/
    organize:
      ./run.sh : bin/run.sh

lint:
  ignore:
    - library
